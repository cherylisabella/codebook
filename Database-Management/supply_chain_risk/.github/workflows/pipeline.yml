name: Supply Chain Risk ETL Pipeline

on:
  workflow_dispatch:        # Manual trigger
  schedule:
    - cron: "0 1 * * *"     # Runs daily at 01:00 UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Load environment variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV

      - name: Run ETL scripts
        run: python etl/run_etl.py

      - name: Run analytical queries
        run: mysql -h $DB_HOST -P $DB_PORT -u$DB_USER -p$DB_PASS $DB_NAME < sql/analytical_queries.sql

      - name: Commit & push exports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/
          git commit -m "Automated export update [skip ci]" || echo "No changes to commit"
          git push